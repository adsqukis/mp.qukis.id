# nginx vhost mpqukis.web.id — satu origin untuk frontend + backend.
#
#   /            -> static build React (dist/)
#   /api/*       -> backend python (127.0.0.1:5010)
#   /health      -> healthcheck backend
#
# Karena frontend & API satu origin, tidak perlu CORS dan tidak perlu
# subdomain/sertifikat tambahan untuk API.
#
# Install:
#   sudo cp deploy/nginx/mpqukis.web.id.conf /etc/nginx/sites-available/mpqukis.web.id
#   sudo ln -sfn /etc/nginx/sites-available/mpqukis.web.id /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Blok TLS/redirect-nya ditambahkan otomatis oleh `certbot --nginx`
# (lihat DEPLOY.md). Jangan tambah listen 443 manual sebelum certbot jalan.

upstream mp_backend {
    server 127.0.0.1:5010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mpqukis.web.id www.mpqukis.web.id;

    root /var/www/mpqukis/current;
    index index.html;

    access_log /var/log/nginx/mpqukis.access.log;
    error_log  /var/log/nginx/mpqukis.error.log;

    # Build Vite pakai hash di nama file, jadi aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html TIDAK boleh di-cache, biar user langsung dapat bundle baru
    # setelah deploy (kalau tidak, browser nyangkut di versi lama).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: semua route non-file dilempar ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://mp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Endpoint Shopee (ads/orders range panjang) bisa lambat: beri ruang.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://mp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    client_max_body_size 8m;
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;
}
