# Nginx site untuk mpqukis.web.id
# Frontend: static hasil `vite build` (dist/) di-serve langsung.
# Backend : /api/* dan /health di-proxy ke app.py (port 5010) di localhost.
#
# Taruh di /etc/nginx/sites-available/mpqukis.web.id lalu:
#   sudo ln -s /etc/nginx/sites-available/mpqukis.web.id /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: jalankan `sudo certbot --nginx -d mpqukis.web.id` (auto-nambah blok SSL).

server {
    listen 80;
    listen [::]:80;
    server_name mpqukis.web.id;

    # Ganti sesuai FRONTEND_DOCROOT di workflow.
    root /var/www/mpqukis.web.id;
    index index.html;

    # SPA fallback — WAJIB, kalau nggak refresh di route mana pun jadi 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API ke backend Python (port 5010).
    location /api/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5010/health;
    }

    # Cache aset ber-hash lama (nama file berubah tiap build).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
